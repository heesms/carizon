server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/carizon?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: carizon
    password: carizon!1
  jackson:
    time-zone: Asia/Seoul
  # Redis 설정 (선택사항)
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
  # Elasticsearch (차량 검색)
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
  # Kafka (차량 인덱스 동기화)
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: car-index-sync-consumer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

# 앱 설정
app:
  kafka:
    enabled: ${KAFKA_ENABLED:false}  # true로 켜야 Consumer/Producer 동작, 단건·배치 sync API 사용 시에만 필요
    car-sync-topic: ${KAFKA_CAR_SYNC_TOPIC:car-index-sync}

# 크롤러별 헤더 주입 (브라우저 DevTools 값으로 오버라이드 가능)
crawler:
  encar:
    headers:
      origin: ${ENCAR_ORIGIN:https://car.encar.com}
      list-referer: ${ENCAR_LIST_REFERER:https://car.encar.com/}
      readside-referer: ${ENCAR_READSIDE_REFERER:https://car.encar.com/}
      # 필요 시 DevTools에서 복사한 Cookie 전체 문자열 주입
      cookie: ${ENCAR_COOKIE:}
    truck:
      list-url-template: ${ENCAR_TRUCK_LIST_URL_TEMPLATE:https://api.encar.com/search/truck/list/mobile?count=true&q=Hidden.N.&sr=%7CMobileModifiedDate%7C{offset}%7C{size}&inav=%7CMetadata%7CSort}

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  level:
    org.springframework.jdbc: INFO
    org.springframework.jdbc.core.StatementCreatorUtils: WARN
    org.mybatis: DEBUG
    org.apache.ibatis: DEBUG
    org.mybatis.spring: DEBUG
    com.carizon.domain.mapper.CarMapper: TRACE
    com.zaxxer.hikari: INFO
    com.carizon: DEBUG
    # Kafka 클라이언트 재연결/연결 실패 로그 억제 (메시지 수신·처리 시에는 com.carizon 로그만 출력)
    org.apache.kafka: ERROR

# RAG 설정
rag:
  # (미사용) TSV 자동 적재는 제거됨. 데이터는 수동 INSERT 또는 별도 스크립트로 적재.
  model-embedding-source-file: ${RAG_MODEL_EMBEDDING_SOURCE_FILE:}

  # Chroma 벡터 DB (로컬 실행: docker run -p 8000:8000 chromadb/chroma)
  chroma:
    base-url: http://localhost:8000
    tenant: default_tenant
    database: default_database
    collection-name: car_listings
    # 모델코드별 설명 임베딩 (AI 추천 시 활용)
    model-collection-name: model_descriptions
  
  # Hugging Face Inference API (무료 티어, API 키 필요)
  # 또는 로컬 Ollama 사용 시 ollama 설정 사용
  embedding:
    provider: ollama # huggingface 또는 ollama
    huggingface:
      api-key: ${HUGGINGFACE_API_KEY:} # 환경변수로 설정
      model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2 # 한국어 지원 모델
    ollama:
      base-url: http://localhost:11434
      # 현재 임베딩 모델: nomic-embed-text (다국어). 한국어 강화: mxbai-embed-large 등
      model: nomic-embed-text
  
  # LLM 설정 (Ollama 로컬 실행)
  # 한글이 깨지면: 앱·Ollama 모두 UTF-8 사용 확인. 한문(중국어) 나오면 프롬프트에 '한국어만' 강조됨.
  llm:
    provider: ollama # ollama 또는 huggingface
    ollama:
      base-url: http://localhost:11434
      # Qwen2.5 (ollama pull qwen2.5:14b-instruct). 속도 느리면 qwen2.5:3b 등 소형 모델로 변경 추천
      model: qwen2.5:14b-instruct
    huggingface:
      api-key: ${HUGGINGFACE_API_KEY:}
      model: meta-llama/Llama-3.1-8B-Instruct
  
  # 추천 로직 설정 (사용자 수정 가능)
  recommendation:
    # 평가 사유를 Ollama로 다듬기 (true면 차량 1대당 1회 호출 → 블로그 10대 시 10회 호출이라 느릴 수 있음. false면 조합 문구만 사용)
    reason-polish-enabled: true
    # 자연어 파서(해석 전용) 설정: LLM 실패 시 즉시 휴리스틱 fallback
    parser:
      timeout-ms: 3500
      circuit-fail-threshold: 3
      circuit-open-ms: 120000
      low-confidence-threshold: 0.45
    # 추천 설명 단계(결정 후 설명 전용) 설정
    explainer:
      enabled: true
      timeout-ms: 8000
    # 추천 이유 생성 로직
    reason:
      # 유사도 점수 임계값 (0.0 ~ 1.0)
      high-similarity-threshold: 0.7
      # 높은 유사도일 때 표시할 메시지 (${score}는 유사도 점수로 치환됨)
      high-similarity-message: "요구사항과 높은 유사도(${score}%)를 보입니다. "
      # 예산 범위 내일 때 표시할 메시지
      within-budget-message: "예산 범위 내의 가격입니다. "
      # 주행거리 임계값 (km)
      low-mileage-threshold: 50000
      # 주행거리가 적을 때 표시할 메시지
      low-mileage-message: "주행거리가 적어 상태가 양호할 가능성이 높습니다. "
      # 기본 추천 이유 메시지
      default-message: "검색 조건과 일치합니다."
    
    # LLM 프롬프트 설정
    prompt:
      # 프롬프트 시작 부분
      intro: "사용자가 다음과 같은 요구사항으로 중고차를 찾고 있습니다:"
      # 가격 범위 표시 형식
      price-range-format: "가격 범위: ${minPrice}만원 이상 ${maxPrice}만원 이하"
      # 차량 목록 제목
      car-list-title: "검색된 차량 목록:"
      # 차량 정보 형식 (${index}, ${maker}, ${model}, ${trim}, ${year}, ${mileage}, ${price} 사용 가능)
      car-format: "${index}. ${maker} ${model} ${trim} (${year}년식) 주행거리: ${mileage}km 가격: ${price}만원"
      # LLM에게 보낼 지시사항 (질문 이해 + 선택 이유 + 5대별 선정 이유)
      instruction: |
        아래 형식으로 한국어로 작성해주세요. 반드시 위 차량 목록만 언급하고, 목록에 없는 차량은 절대 추가하지 마세요.
        1) 질문 이해: 사용자 요구사항을 어떻게 이해했는지 1~2문장으로 적어주세요.
        2) 선택 이유: 왜 이 차량들을 추천했는지(전체적인 선정 기준) 1~2문장으로 적어주세요.
        3) 5대 차량 선정 이유: 위 목록의 1번~5번 차량에 대해, 각 차량을 왜 추천했는지 한 대씩 1문장씩 적어주세요. (예: 1번 볼보 XC60 - ... 2번 ...)
        친절하고 자연스럽게, 너무 길지 않게 작성해주세요.
      # LLM 실패 시 기본 메시지
      default-recommendation: "검색된 차량 중에서 요구사항에 맞는 차량을 추천드립니다."
