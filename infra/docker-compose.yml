version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: carizon-redis
    environment:
      TZ: Asia/Seoul
    ports:
      - "6379:6379"
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: carizon-meilisearch
    environment:
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: true
      TZ: Asia/Seoul
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data
    restart: unless-stopped

volumes:
  meili_data:
